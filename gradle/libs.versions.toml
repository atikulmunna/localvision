[versions]
# Gradle 8.14.3 and AGP 8.13.0 were both already in the local caches, and AGP
# 8.13 requires Gradle 8.13 or newer, so this pair needs no download.
agp = "8.13.0"
kotlin = "2.1.20"
# compileSdk and targetSdk are 36 because that is the highest platform the
# installed SDK provides. The target device runs API 37; targeting 36 is fine
# and avoids a platform download.
compileSdk = "36"
minSdk = "29"
targetSdk = "36"

camerax = "1.4.2"
litert = "1.4.0"
litertGpu = "1.4.0"
kotlinxSerialization = "1.8.0"
coreKtx = "1.15.0"
activity = "1.9.3"
androidxTestCore = "1.6.1"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# LiteRT runtime plus the GPU delegate. No Ultralytics dependency anywhere:
# the app ships exported weight files only, which keeps AGPL out of it.
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litertGpu" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# WindowInsetsCompat: the app targets SDK 36 and so lays out edge to edge.
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
